<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Arrow marker definitions (auto-orient with line direction) -->
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#0f1117"/>

  <!-- ── TITLE ── -->
  <text x="600" y="30" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">Multi-Query Retrieval Pipeline</text>
  <text x="600" y="52" text-anchor="middle" fill="#6b7280" font-size="12">QueryRewriter  ·  union_pool  ·  ListwiseReranker  ·  pyrlm-runtime</text>

  <!-- ══════════════════════════════════════════════
       STEP 1 — Original Query
  ══════════════════════════════════════════════ -->
  <rect x="380" y="75" width="440" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="97" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">OBLIQUE QUERY</text>
  <text x="600" y="118" text-anchor="middle" fill="#f1f5f9" font-size="13">"Tweets criticizing the new return-to-office mandate"</text>

  <!-- Arrow down from query → rewriter -->
  <line x1="600" y1="130" x2="600" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Anchor curve: original query (right side) → BM25 box 6 (top), bypassing rewriter -->
  <path d="M 820,102 C 960,102 1050,140 1050,234"
        stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3" fill="none"
        marker-end="url(#arrow-amber)"/>

  <!-- ══════════════════════════════════════════════
       STEP 2 — Rewriter
  ══════════════════════════════════════════════ -->
  <rect x="460" y="162" width="280" height="50" rx="10" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="182" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1">LLM REWRITER</text>
  <text x="600" y="201" text-anchor="middle" fill="#dbeafe" font-size="12">QueryRewriter  ·  5 reformulations  ·  1 call</text>

  <!-- Distribution: rewriter → bar → 5 BM25 boxes (all vertical arrows) -->
  <!-- Vertical line from rewriter bottom (600, 212) down to bar (y=222) -->
  <line x1="600" y1="212" x2="600" y2="222" stroke="#475569" stroke-width="1.5"/>

  <!-- Horizontal distribution bar -->
  <line x1="135" y1="222" x2="870" y2="222" stroke="#475569" stroke-width="1.5"/>

  <!-- 5 short vertical arrows from bar down to each BM25 box top (y=237) -->
  <line x1="135" y1="222" x2="135" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <line x1="320" y1="222" x2="320" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <line x1="505" y1="222" x2="505" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <line x1="685" y1="222" x2="685" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <line x1="870" y1="222" x2="870" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

  <!-- ══════════════════════════════════════════════
       STEP 3 — BM25 searches (6 boxes)
  ══════════════════════════════════════════════ -->

  <!-- box 1 -->
  <rect x="70" y="237" width="130" height="50" rx="8" fill="#1a2535" stroke="#334155" stroke-width="1"/>
  <text x="135" y="257" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BM25</text>
  <text x="135" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">"office-return complaints"</text>

  <!-- box 2 -->
  <rect x="255" y="237" width="130" height="50" rx="8" fill="#1a2535" stroke="#334155" stroke-width="1"/>
  <text x="320" y="257" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BM25</text>
  <text x="320" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">"commute burnout"</text>

  <!-- box 3 -->
  <rect x="440" y="237" width="130" height="50" rx="8" fill="#1a2535" stroke="#334155" stroke-width="1"/>
  <text x="505" y="257" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BM25</text>
  <text x="505" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">"WFH productivity"</text>

  <!-- box 4 -->
  <rect x="620" y="237" width="130" height="50" rx="8" fill="#1a2535" stroke="#334155" stroke-width="1"/>
  <text x="685" y="257" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BM25</text>
  <text x="685" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">"forced on-site"</text>

  <!-- box 5 -->
  <rect x="805" y="237" width="130" height="50" rx="8" fill="#1a2535" stroke="#334155" stroke-width="1"/>
  <text x="870" y="257" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">BM25</text>
  <text x="870" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">"meeting overload"</text>

  <!-- box 6 — original query anchor (amber) -->
  <rect x="985" y="237" width="130" height="50" rx="8" fill="#1c1a10" stroke="#d97706" stroke-width="1.5"/>
  <text x="1050" y="256" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">BM25  ·  ANCHOR</text>
  <text x="1050" y="275" text-anchor="middle" fill="#fbbf24" font-size="10">original query</text>

  <!-- ══════════════════════════════════════════════
       STEP 4 — Convergence to union_pool
  ══════════════════════════════════════════════ -->

  <!-- Each box has a short vertical line down to the convergence bus -->
  <line x1="135" y1="287" x2="135" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="320" y1="287" x2="320" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="505" y1="287" x2="505" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="685" y1="287" x2="685" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="870" y1="287" x2="870" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="1050" y1="287" x2="1050" y2="318" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Horizontal convergence bus -->
  <line x1="135" y1="318" x2="1050" y2="318" stroke="#475569" stroke-width="1.5"/>

  <!-- Single arrow from bus center down to union pool -->
  <line x1="600" y1="318" x2="600" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Label above the bus -->
  <text x="600" y="307" text-anchor="middle" fill="#475569" font-size="10">25 results each  →  ~150 total</text>

  <!-- ══════════════════════════════════════════════
       STEP 5 — union_pool
  ══════════════════════════════════════════════ -->
  <rect x="430" y="352" width="340" height="55" rx="10" fill="#14292b" stroke="#0d9488" stroke-width="1.5"/>
  <text x="600" y="374" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="600" letter-spacing="1">UNION POOL  ·  DEDUPLICATED</text>
  <text x="600" y="394" text-anchor="middle" fill="#99f6e4" font-size="12">~128 unique documents  ·  pool recall 16.1%</text>

  <!-- Arrow down -->
  <line x1="600" y1="407" x2="600" y2="433" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- ══════════════════════════════════════════════
       STEP 6 — Reranker
  ══════════════════════════════════════════════ -->
  <rect x="420" y="437" width="360" height="55" rx="10" fill="#1e1635" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="459" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600" letter-spacing="1">LISTWISE RERANKER</text>
  <text x="600" y="479" text-anchor="middle" fill="#ede9fe" font-size="12">scores against ORIGINAL query  ·  sliding window 20</text>

  <!-- Arrow down -->
  <line x1="600" y1="492" x2="600" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- ══════════════════════════════════════════════
       STEP 7 — Result
  ══════════════════════════════════════════════ -->
  <rect x="430" y="522" width="340" height="38" rx="8" fill="#14290a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="546" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">Top-10  ·  NDCG@10 = 0.093  ·  3.3× BM25</text>

  <!-- ══════════════════════════════════════════════
       LEGEND (bottom)
  ══════════════════════════════════════════════ -->
  <line x1="380" y1="595" x2="408" y2="595" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="416" y="599" fill="#d97706" font-size="11">original query as anchor  —  eliminates regressions, +29% NDCG vs rewrites only</text>

</svg>
